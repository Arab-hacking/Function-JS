      function abc(sign, a, b) {
        if (sign == "+") {
          return a + b;
        } else if (sign == "-") {
          return a - b;
        } else if (sign == "*") {
          return a * b;
        } else if (sign == "/") {
          if (a == 0 || b == 0) {
            log("На 0 делить нельзя");
          } else {
            return a / b;
          }
        }
      }
